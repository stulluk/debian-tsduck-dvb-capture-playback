[package]
name = "dvbhub"
version = "0.1.0"
edition = "2021"
description = "Hybrid DVB capture/playback orchestrator built on TSDuck (DTU-315, TBS5530, PCTV 461)"
license = "MIT"
rust-version = "1.74"

[[bin]]
name = "dvbhub"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "io-util", "time", "sync", "fs"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
ureq = { version = "2", default-features = false, features = ["tls"] }
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
ratatui = { version = "0.29", features = ["all-widgets"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
